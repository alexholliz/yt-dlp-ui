name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for vulnerabilities
        # Fail the build on high or critical severity vulnerabilities.
        # Dependabot will open a PR to fix them; this gate prevents merging while they exist.
        run: npm audit --audit-level=high

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t yt-dlp-ui:test .

      - name: Run unit tests
        run: docker run --rm yt-dlp-ui:test

      - name: Build production image
        run: docker build --target production -t yt-dlp-ui:prod .

      - name: Start server (no auth)
        run: |
          docker run -d --name test-server -p 8189:8189 \
            -e SESSION_SECRET=ci-test-secret-not-for-production \
            yt-dlp-ui:prod
          # Wait until /login responds
          for i in $(seq 1 30); do
            curl -sf http://localhost:8189/login && break
            sleep 1
          done

      - name: Verify API endpoints accessible (no auth configured)
        run: |
          fail=0
          check() {
            status=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" http://localhost:8189"$2")
            if [ "$status" != "$3" ]; then
              echo "FAIL: $1 $2 => $status (expected $3)"
              fail=1
            else
              echo "OK:   $1 $2 => $status"
            fi
          }
          # Public routes always accessible
          check GET  /                     200
          check GET  /login                200
          check GET  /css/styles.css       200
          check GET  /js/app.js            200
          # API routes open when no credentials configured
          check GET  /api/profiles         200
          check GET  /api/channels         200
          check GET  /api/downloads/recent 200
          check GET  /api/stats            200
          check GET  /api/scheduler/status 200
          check GET  /api/cookies          200
          check GET  /api/youtube-api/key  200
          check GET  /api/youtube-api/quota 200
          check GET  /api/config           200
          exit $fail

      - name: Start auth-protected server
        run: |
          docker run -d --name test-server-auth -p 8190:8189 \
            -e BASIC_AUTH_USERNAME=ciuser \
            -e BASIC_AUTH_PASSWORD=cipassword123 \
            -e SESSION_SECRET=ci-test-secret-not-for-production \
            yt-dlp-ui:prod
          for i in $(seq 1 30); do
            # Allow curl to fail (connection refused) while server is starting;
            # capture status without triggering bash -e on a non-zero exit code.
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8190/login 2>/dev/null) || true
            [ "$status" = "200" ] && break
            sleep 1
          done
          [ "$status" = "200" ] || { echo "Auth server did not start within 30s"; exit 1; }

      - name: Verify all API endpoints blocked without session (auth configured)
        run: |
          fail=0
          check_blocked() {
            status=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" http://localhost:8190"$2")
            if [ "$status" != "401" ]; then
              echo "LEAK: $1 $2 => $status (expected 401)"
              fail=1
            else
              echo "OK:   $1 $2 => 401 (blocked)"
            fi
          }
          check_blocked GET  /api/profiles
          check_blocked GET  /api/channels
          check_blocked GET  /api/downloads/recent
          check_blocked GET  /api/stats
          check_blocked GET  /api/stats/channels
          check_blocked GET  /api/scheduler/status
          check_blocked POST /api/scheduler/run
          check_blocked GET  /api/cookies
          check_blocked POST /api/cookies
          check_blocked DELETE /api/cookies
          check_blocked POST /api/cookies/validate
          check_blocked GET  /api/youtube-api/key
          check_blocked POST /api/youtube-api/key
          check_blocked DELETE /api/youtube-api/key
          check_blocked GET  /api/youtube-api/quota
          check_blocked GET  /api/config
          check_blocked PUT  /api/config
          exit $fail

      - name: Verify login page and static assets reachable without session
        run: |
          fail=0
          check_open() {
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8190"$1")
            if [ "$status" != "200" ]; then
              echo "FAIL: GET $1 => $status (expected 200)"
              fail=1
            else
              echo "OK:   GET $1 => 200 (public)"
            fi
          }
          check_open /login
          check_open /css/styles.css
          check_open /js/app.js
          exit $fail

      - name: Verify authenticated session grants access
        run: |
          # Log in, capture session cookie
          cookie=$(curl -s -c - -X POST http://localhost:8190/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ciuser","password":"cipassword123"}' \
            | grep connect.sid | awk '{print $6"="$7}')
          if [ -z "$cookie" ]; then
            echo "FAIL: Login did not return a session cookie"
            exit 1
          fi
          echo "Session cookie acquired"
          # Hit a representative set of endpoints with the cookie
          fail=0
          check_auth() {
            status=$(curl -s -o /dev/null -w "%{http_code}" -X "$1" \
              -b "$cookie" http://localhost:8190"$2")
            if [ "$status" != "200" ]; then
              echo "FAIL: $1 $2 => $status (expected 200 with valid session)"
              fail=1
            else
              echo "OK:   $1 $2 => 200 (authenticated)"
            fi
          }
          check_auth GET /api/profiles
          check_auth GET /api/channels
          check_auth GET /api/stats
          check_auth GET /api/cookies
          check_auth GET /api/youtube-api/key
          check_auth GET /api/youtube-api/quota
          check_auth GET /api/config
          exit $fail

      - name: Cleanup test servers
        if: always()
        run: |
          docker stop test-server test-server-auth 2>/dev/null || true
          docker rm   test-server test-server-auth 2>/dev/null || true

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # Note: ARM64 re-enabled after removing jsdom (heavy dependency with native bindings)
          # jsdom was causing QEMU emulation issues, removed as it wasn't being used yet

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
