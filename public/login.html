<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — yt-dlp-ui</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --primary:    #ee512b;
      --bg:         #0f172a;
      --surface:    #1e293b;
      --border:     #334155;
      --text:       #f1f5f9;
      --text-muted: #94a3b8;
      --error:      #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .logo img { width: 32px; height: 32px; }
    .logo span { font-size: 1.2rem; font-weight: 600; }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      border-radius: 6px;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9375rem;
      margin-bottom: 1.125rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%;
      padding: 0.6875rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/favicon.svg" alt="">
      <span>yt-dlp-ui</span>
    </div>

    <div class="error" id="err">Incorrect username or password.</div>

    <form method="POST" action="/auth/login">
      <input type="hidden" name="next" id="next-field" value="">

      <label for="username">Username</label>
      <input type="text" id="username" name="username"
             autocomplete="username" autofocus required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    if (p.get('error')) document.getElementById('err').style.display = 'block';
    const nxt = p.get('next');
    if (nxt) document.getElementById('next-field').value = nxt;
  </script>
</body>
</html>
